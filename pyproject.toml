[project]
name = "story-engine"
version = "0.1.0"
description = "Octopath Traveler II story generation CLI"
requires-python = ">=3.12"
dependencies = [
    "typer",
    "pydantic",
    "pyyaml",
    "claude-agent-sdk>=0.2.168",
    "python-frontmatter>=1.3.0",
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "uvicorn>=0.54.0",
    "markdown>=3.11.2",
]

[project.scripts]
story-engine = "story_engine.cli:app"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not e2e'"
markers = ["e2e: tests that call live models"]
