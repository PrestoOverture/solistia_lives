<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Building the knowledge base: game wiki, pull, polish, link, knowledge base">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1330"/>
      <stop offset="1" stop-color="#241f48"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9a24a"/>
      <stop offset="0.5" stop-color="#f3dc95"/>
      <stop offset="1" stop-color="#c9a24a"/>
    </linearGradient>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#e2c376"/>
    </marker>
    <style>
      text { font-family: 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; }
      .title { font-size: 28px; font-weight: 600; fill: url(#gold); }
      .sub { font-size: 15px; fill: #b9b0d6; }
      .h { font-size: 19px; font-weight: 600; fill: #f3e6c4; }
      .h2 { font-size: 17px; font-weight: 600; fill: #f3e6c4; }
      .big { font-size: 22px; font-weight: 700; fill: #f3dc95; }
      .t { font-size: 14.5px; fill: #ddd4ee; }
      .dim { font-size: 13.5px; fill: #a59cc4; }
      .key { font-size: 14.5px; font-weight: 600; fill: #f09a82; }
      .chip { font-size: 13.5px; font-weight: 600; fill: #f3e6c4; }
      .card { fill: #1a1d44; stroke: #c9a24a; stroke-opacity: 0.55; stroke-width: 1.4; }
      .kb { fill: #2a2448; stroke: #f3dc95; stroke-width: 2; }
      .src { fill: #151838; stroke: #6f68a3; stroke-opacity: 0.7; stroke-width: 1.3; stroke-dasharray: 5 4; }
      .side { fill: #161a3d; stroke: #7d75c9; stroke-opacity: 0.7; stroke-width: 1.3; }
      .ico { fill: none; stroke: #f3dc95; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>
  <g fill="#f3dc95" opacity="0.5">
    <circle cx="80" cy="44" r="1.6"/><circle cx="1120" cy="38" r="1.8"/><circle cx="1040" cy="76" r="1.1"/>
    <circle cx="170" cy="80" r="1.1"/><circle cx="1160" cy="570" r="1.4"/><circle cx="40" cy="575" r="1.2"/>
  </g>

  <text x="600" y="50" text-anchor="middle" class="title">Knowledge base: from the game wiki to checkable lore</text>
  <text x="600" y="78" text-anchor="middle" class="sub">Built in three steps, one job each, every step checked</text>

  <!-- source -->
  <rect x="30" y="106" width="200" height="266" rx="14" class="src"/>
  <g class="ico" transform="translate(130 140)">
    <circle cx="0" cy="0" r="16"/><path d="M-16 0 H16 M0 -16 Q10 0 0 16 M0 -16 Q-10 0 0 16"/>
  </g>
  <text x="130" y="186" text-anchor="middle" class="h">Game wiki</text>
  <text x="130" y="224" text-anchor="middle" class="big">≈ 4,700 pages</text>
  <text x="48" y="262" class="t">The Octopath Traveler</text>
  <text x="48" y="286" class="t">wiki on Fandom</text>
  <text x="48" y="318" class="dim">Covers the whole series:</text>
  <text x="48" y="340" class="dim">OT1, OT2, mobile games…</text>

  <!-- ① pull -->
  <rect x="270" y="106" width="200" height="266" rx="14" class="card"/>
  <g class="ico" transform="translate(370 140)">
    <path d="M-14 -16 H6 L14 -8 V16 H-14Z"/><path d="M6 -16 V-8 H14"/><path d="M-6 2 L-1 7 L8 -3" stroke="#8cc79a"/>
  </g>
  <text x="370" y="186" text-anchor="middle" class="h">① Pull</text>
  <text x="370" y="224" text-anchor="middle" class="big">646 pages</text>
  <text x="288" y="262" class="t">Checks each page:</text>
  <text x="288" y="286" class="t">is it OT2?</text>
  <text x="288" y="318" class="t">Saves the full text,</text>
  <text x="288" y="342" class="t">word for word</text>

  <!-- ② polish -->
  <rect x="510" y="106" width="200" height="266" rx="14" class="card"/>
  <g class="ico" transform="translate(610 140)">
    <path d="M-12 14 L10 -8"/><path d="M6 -12 L14 -4"/><path d="M-12 14 L-16 18"/>
    <path d="M-16 -14 L-12 -10 M-6 -18 V-13 M-18 -4 H-13" stroke-opacity="0.7"/>
  </g>
  <text x="610" y="186" text-anchor="middle" class="h">② Polish</text>
  <text x="610" y="224" text-anchor="middle" class="big">514 files</text>
  <text x="528" y="262" class="t">Cuts gameplay data and</text>
  <text x="528" y="286" class="t">other games' content,</text>
  <text x="528" y="310" class="t">cleans and files it</text>
  <text x="528" y="344" class="key">Delete only, never add</text>

  <!-- ③ link -->
  <rect x="750" y="106" width="200" height="266" rx="14" class="card"/>
  <g class="ico" transform="translate(850 140)">
    <path d="M-4 4 L4 -4"/>
    <path d="M-2 -8 L4 -14 Q10 -18 14 -14 Q18 -10 14 -4 L8 2"/>
    <path d="M2 8 L-4 14 Q-10 18 -14 14 Q-18 10 -14 4 L-8 -2"/>
  </g>
  <text x="850" y="186" text-anchor="middle" class="h">③ Link</text>
  <text x="850" y="224" text-anchor="middle" class="big">wiki → local</text>
  <text x="768" y="262" class="t">Turns wiki links into</text>
  <text x="768" y="286" class="t">relative KB paths</text>
  <text x="768" y="318" class="dim">Links outside the KB</text>
  <text x="768" y="340" class="dim">become plain text</text>

  <!-- KB -->
  <rect x="990" y="106" width="180" height="266" rx="14" class="kb"/>
  <g class="ico" transform="translate(1080 140)">
    <path d="M-18 -14 H-2 Q2 -14 2 -10 V16 Q2 12 -2 12 H-18Z"/>
    <path d="M22 -14 H6 Q2 -14 2 -10 V16 Q2 12 6 12 H22Z"/>
  </g>
  <text x="1080" y="186" text-anchor="middle" class="h">Knowledge base</text>
  <text x="1080" y="214" text-anchor="middle" class="dim">Markdown files</text>
  <g>
    <rect x="1004" y="232" width="152" height="28" rx="14" fill="#3a2f55"/>
    <text x="1020" y="251" class="chip">People</text><text x="1140" y="251" text-anchor="end" class="chip" fill="#f3dc95">149</text>
    <rect x="1004" y="266" width="152" height="28" rx="14" fill="#3a2f55"/>
    <text x="1020" y="285" class="chip">Places</text><text x="1140" y="285" text-anchor="end" class="chip" fill="#f3dc95">204</text>
    <rect x="1004" y="300" width="152" height="28" rx="14" fill="#3a2f55"/>
    <text x="1020" y="319" class="chip">World</text><text x="1140" y="319" text-anchor="end" class="chip" fill="#f3dc95">84</text>
    <rect x="1004" y="334" width="152" height="28" rx="14" fill="#3a2f55"/>
    <text x="1020" y="353" class="chip">Stories</text><text x="1140" y="353" text-anchor="end" class="chip" fill="#f3dc95">77</text>
  </g>

  <!-- arrows -->
  <path d="M232 239 H266" stroke="#e2c376" stroke-width="2.2" marker-end="url(#ag)"/>
  <path d="M472 239 H506" stroke="#e2c376" stroke-width="2.2" marker-end="url(#ag)"/>
  <path d="M712 239 H746" stroke="#e2c376" stroke-width="2.2" marker-end="url(#ag)"/>
  <path d="M952 239 H986" stroke="#e2c376" stroke-width="2.2" marker-end="url(#ag)"/>

  <!-- bottom panels -->
  <rect x="30" y="408" width="370" height="160" rx="14" class="side"/>
  <g class="ico" transform="translate(62 440)">
    <path d="M0 -14 L12 -9 V0 Q12 10 0 15 Q-12 10 -12 0 V-9Z"/><path d="M-5 0 L-1 4 L6 -4" stroke="#8cc79a"/>
  </g>
  <text x="86" y="446" class="h2">Checked at every step</text>
  <text x="50" y="482" class="t">· Each step has check scripts, rerun by Claude:</text>
  <text x="50" y="506" class="dim">   missing, empty, misfiled, or added content</text>
  <text x="50" y="536" class="t">· The author reviewed all eight traveler files</text>

  <rect x="415" y="408" width="370" height="160" rx="14" class="side"/>
  <g class="ico" transform="translate(447 440)">
    <path d="M-12 -12 H12 V8 H2 L-6 15 V8 H-12Z"/><path d="M0 -6 V1 M0 4 V5"/>
  </g>
  <text x="471" y="446" class="h2">The KB is canon</text>
  <text x="435" y="482" class="t">· The validator must quote its evidence</text>
  <text x="435" y="508" class="t">· Wrong lore? Fix the KB</text>
  <text x="435" y="536" class="dim">Life after the game lives in the cards</text>

  <rect x="800" y="408" width="370" height="160" rx="14" class="side"/>
  <g class="ico" transform="translate(832 440)">
    <circle cx="-3" cy="-3" r="10"/><path d="M5 5 L13 13"/>
  </g>
  <text x="856" y="446" class="h2">How it is read</text>
  <text x="820" y="482" class="t">· No vector store: agents read files</text>
  <text x="820" y="506" class="t">   by path, name, and link</text>
  <text x="820" y="536" class="t">· Every lookup is logged in the trace</text>
</svg>
