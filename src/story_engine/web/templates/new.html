{% extends "base.html" %}
{% block title %}New story{% endblock %}
{% block content %}
<header>
  <a href="{{ url_for('library') }}">← Story library</a>
  <h1>New story</h1>
</header>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('submit_story') }}" hx-boost="false">
  <fieldset>
    <legend>Choose 2–3 travelers</legend>
    {% for slug, name in travelers.items() %}
    <label><input type="checkbox" name="characters" value="{{ slug }}"{% if slug in selected %} checked{% endif %}> {{ name }}</label><br>
    {% endfor %}
  </fieldset>
  <p><label for="location">Location</label><br>
    <select id="location" name="location" required>
      <option value="">Choose a location</option>
      {% for slug, name in locations.items() %}
      <option value="{{ slug }}"{% if slug == location %} selected{% endif %}>{{ name }}</option>
      {% endfor %}
    </select>
  </p>
  <p><label for="situation">Starting situation</label><br>
    <textarea id="situation" name="situation" rows="5">{{ situation }}</textarea>
  </p>
  <button type="submit">Generate story</button>
</form>
{% endblock %}
